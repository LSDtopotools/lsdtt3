[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "lsdtt3"
version = "0.0.0"
description = "Python bindings for LSDTopoTools3"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "geopandas>=1.0"]

[tool.scikit-build]
wheel.packages = ["src/lsdtt3"]
cmake.build-type = "Release"
