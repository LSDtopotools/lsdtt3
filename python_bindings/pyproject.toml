[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=3.0,<3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "lsdtt3"
version = "0.9.3.post1"
description = "Python bindings for LSDTopoTools3"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "geopandas>=1.0", "tomli>=2.0; python_version<'3.11'"]

[project.urls]
Homepage = "https://lsdtopotools.github.io/lsdtt3/"
Documentation = "https://lsdtopotools.github.io/lsdtt3/python/index.html"
Repository = "https://github.com/LSDtopotools/lsdtt3"
Issues = "https://github.com/LSDtopotools/lsdtt3/issues"

[project.scripts]
lsdtt-raster-preprocessing = "lsdtt3._cli:main"
lsdtt-synthetic-surfaces = "lsdtt3._cli:main"
lsdtt-synthetic-networks = "lsdtt3._cli:main"
lsdtt-surface-metrics = "lsdtt3._cli:main"
lsdtt-slope-area = "lsdtt3._cli:main"
lsdtt-channel-extraction = "lsdtt3._cli:main"
lsdtt-internal-drainage = "lsdtt3._cli:main"
lsdtt-hillslope-channel-coupling = "lsdtt3._cli:main"
lsdtt-drainage-analysis = "lsdtt3._cli:main"
lsdtt-distributed-hydrology = "lsdtt3._cli:main"
lsdtt-feature-finder = "lsdtt3._cli:main"
lsdtt-mountain-front = "lsdtt3._cli:main"
lsdtt-outlet-matching = "lsdtt3._cli:main"
lsdtt-basin-stats = "lsdtt3._cli:main"
lsdtt-basin-extraction = "lsdtt3._cli:main"
lsdtt-flat-surface-finder = "lsdtt3._cli:main"
lsdtt-fluvial-surfaces = "lsdtt3._cli:main"
lsdtt-valley-centreline = "lsdtt3._cli:main"
lsdtt-graphflood = "lsdtt3._cli:main"
lsdtt-channel-network-analysis = "lsdtt3._cli:main"
lsdtt-cross-sections = "lsdtt3._cli:main"
lsdtt-stream-burning = "lsdtt3._cli:main"
lsdtt-water-line-repair = "lsdtt3._cli:main"
lsdtt-water-centreline = "lsdtt3._cli:main"
lsdtt-cosmo-tool = "lsdtt3._cli:main"
lsdtt-cosmo-prediction = "lsdtt3._cli:main"
lsdtt-cosmo-landslides = "lsdtt3._cli:main"
lsdtt-cosmo-column-tool = "lsdtt3._cli:main"
lsdtt-marsh-topography = "lsdtt3._cli:main"
lsdtt-linear-stats = "lsdtt3._cli:main"
lsdtt-swath-profile = "lsdtt3._cli:main"
lsdtt-lem = "lsdtt3._cli:main"
lsdtt-lithology-erodibility = "lsdtt3._cli:main"
lsdtt-advection-diffusion = "lsdtt3._cli:main"
lsdtt-sediment-routing = "lsdtt3._cli:main"
lsdtt-ridgeline-analysis = "lsdtt3._cli:main"
lsdtt-basin-surface-metrics = "lsdtt3._cli:main"
lsdtt-divide-migration = "lsdtt3._cli:main"
lsdtt-raster-calculator = "lsdtt3._cli:main"
lsdtt-fetch-raster = "lsdtt3._cli:main"
lsdtt-fetch-lithology = "lsdtt3._cli:main"
lsdtt-fetch-river-lines = "lsdtt3._cli:main"
lsdtt-fetch-erosion-rates = "lsdtt3._cli:main"
lsdtt-bankfull-width = "lsdtt3._cli:main"
lsdtt-spectral-analysis = "lsdtt3._cli:main"
lsdtt-chi-analysis = "lsdtt3._cli:main"

[tool.scikit-build]
wheel.packages = ["src/lsdtt3"]
cmake.build-type = "Release"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"   # PyPy is off by default in cibuildwheel >= 3
test-requires = ["pytest"]
test-command = "cd {project} && python -m pytest -q python_bindings/tests && python python_bindings/tools/check_api_examples.py --run && python python_bindings/tools/check_installed_wheel.py --manifest python_bindings/api/public_api.json --smoke-console-scripts"
environment = { CMAKE_ARGS = "-DLSDTT_PYTHON_RELEASE_WHEEL=ON" }

[tool.cibuildwheel.linux]
archs = ["x86_64"]
# PROJ, GDAL, GEOS, SQLite and curl are built from source: EPEL 8's GDAL 3.0 / PROJ 6.3
# cannot handle datum-ensemble CRSs. See the script's header.
before-all = "bash {project}/python_bindings/tools/build_manylinux_native_deps.sh"

[tool.cibuildwheel.windows]
# Same as test-command above, but `cd /d`: cibuildwheel runs the test command in
# cmd.exe from a temp folder on C:, and plain `cd D:\...` changes the D: drive's
# folder without switching drives, so pytest could not find python_bindings/tests
# (v0.9.3 Windows wheel).
test-command = "cd /d {project} && python -m pytest -q python_bindings/tests && python python_bindings/tools/check_api_examples.py --run && python python_bindings/tools/check_installed_wheel.py --manifest python_bindings/api/public_api.json --smoke-console-scripts"

[tool.cibuildwheel.macos]
# pkgconf: pkg-config is the FFTW route on Homebrew (fftw is built with autotools,
# so a CMake package is not relied on). libomp is keg-only; cmake/lsdtt_homebrew_openmp.cmake finds it.
before-all = "for f in gdal fftw netcdf eigen libomp pkgconf; do brew list --formula $f >/dev/null 2>&1 || brew install $f; done"
