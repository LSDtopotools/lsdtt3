name: Build Python wheels

# Builds wheels for ONE existing lsdtt3 tag: Linux only (1 wheel) or every
# platform (4 wheels: Linux x86_64, macOS arm64 and x86_64, Windows x64).
# Each is a cp312-abi3 wheel (Python 3.12 and later), built once on CPython
# 3.12 and then installed and tested on 3.12, 3.13 and 3.14.
#
# Two ways in:
#   - called by release.yml on every vX.Y.Z tag, after the Linux backend has
#     built and created the release: all platforms, uploaded to the release;
#   - by hand from the Actions tab, for a vX.Y.Z.postN wheel-only rebuild of
#     the same source, or to rebuild one tag's wheels.
#
# Publishing to PyPI stays a separate, manual step
# (docs/developer_notes/publishing_to_pypi.md). This workflow never bumps a
# version, commits or tags.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build (vX.Y.Z or vX.Y.Z.postN)
        required: true
        type: string
      platforms:
        description: linux or all
        required: false
        type: string
        default: all
      upload:
        description: Upload the wheels to the GitHub release vX.Y.Z
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (vX.Y.Z or vX.Y.Z.postN)
        required: true
        type: string
      platforms:
        description: Which wheels to build (linux = Linux x86_64 only; windows = Windows x64 only; all = Linux, macOS ARM64 and Intel, Windows)
        required: true
        type: choice
        options:
          - linux
          - windows
          - all
        default: linux
      upload:
        description: Upload the wheels to the GitHub release vX.Y.Z (otherwise they stay workflow artefacts)
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: python-wheel-release
  cancel-in-progress: false

# Windows native dependencies come from vcpkg PINNED to one release, not the
# copy preinstalled on the runner image (C:\vcpkg). The preinstalled copy moves
# whenever GitHub updates the image, which changes every port's ABI hash, so the
# binary cache misses and GDAL rebuilds from source: hours on a cold cache
# (docs/developer_notes/making_release_packages.md). The cache release runs
# restore lives on main (vcpkg-cache.yml): a cache saved by a tag run is
# visible only to that tag. Keep VCPKG_TAG identical in all three workflows. The cache key is the
# release tag + triplet + .github/vcpkg-packages.txt, so it changes only when one
# of those is edited. A runner MSVC update can still change the ABI hash and force one
# slow rebuild; restore-keys then reuse every archive that still matches.
env:
  VCPKG_TAG: "2026.10.16"
  VCPKG_PINNED_ROOT: 'C:\vcpkg-pinned'
  VCPKG_TRIPLET: x64-windows

jobs:
  prepare-release:
    name: Check the tag and the API contracts
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      release: ${{ steps.source.outputs.release }}
      matrix: ${{ steps.platforms.outputs.matrix }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      # The 'v' belongs to the tag only; every file stores the bare number.
      # CMake holds X.Y.Z; pyproject.toml holds X.Y.Z or X.Y.Z.postN.
      - name: Check the tag against the version files
        id: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(\.post[0-9]+)?$ ]]; then
            echo "Tag '${TAG}' is not vX.Y.Z or vX.Y.Z.postN." >&2
            exit 1
          fi
          stem="${BASH_REMATCH[1]}"
          cmake_version="$(sed -n 's/^project(lsdtt3 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          py_version="$(sed -n '/^\[project\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' python_bindings/pyproject.toml)"
          if [[ "${stem}" != "${cmake_version}" ]]; then
            echo "Tag ${TAG} has stem ${stem}, but its CMakeLists.txt says ${cmake_version}." >&2
            exit 1
          fi
          if [[ "${TAG#v}" != "${py_version}" ]]; then
            echo "Tag ${TAG} does not match its pyproject.toml version ${py_version}." >&2
            exit 1
          fi
          python3 tests/scripts/check_version_consistency.py --repo-root .
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "release=v${stem}" >> "${GITHUB_OUTPUT}"

      # The build matrix is chosen here rather than skipped per job, so a
      # Linux-only run starts no macOS or Windows runner at all.
      - name: Choose the platforms to build
        id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          python3 - <<'PY'
          import json, os
          release = 'CMAKE_ARGS="-DLSDTT_PYTHON_RELEASE_WHEEL=ON'
          # ccache (Linux and macOS): the lsdtt3 runtime compiles identically
          # for every Python version, so wheels 2-5 reuse its objects. ccache
          # only matches identical commands, so each wheel builds in a fixed
          # same-depth folder (SKBUILD_BUILD_DIR, {wheel_tag} filled in by
          # scikit-build-core) and paths are made relative to the project root
          # (CCACHE_BASEDIR). python_bindings/tools/ci_ccache.sh installs it.
          # Windows uses ccache too, but needs Ninja (the default Visual Studio
          # generator ignores compiler launchers, and builds the ~250 runtime
          # files of one project one at a time). The Windows launcher comes from
          # LSDTT_WINDOWS_LAUNCHER, which the "Install ccache (Windows)" step
          # sets only if ccache installed, so a failed download never fails the
          # build.
          # The launcher goes in CMAKE_ARGS, which only scikit-build-core reads,
          # NOT in the CMAKE_<LANG>_COMPILER_LAUNCHER environment variables:
          # CIBW_ENVIRONMENT also applies to before-all, whose dependency build
          # (PROJ/GDAL/GEOS on Linux) runs before ci_ccache.sh installs ccache,
          # and every CMake project there picked the launcher up and failed with
          # "ccache: Command not found" (v0.9.2).
          launch = " -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          def ccache(root):
              return (f" CCACHE_BASEDIR={root} CCACHE_NOHASHDIR=true CCACHE_MAXSIZE=5G"
                      f" SKBUILD_BUILD_DIR={root}/python_bindings/build/cibw-{{wheel_tag}}")
          legs = [
              {"name": "Linux x86_64", "os": "ubuntu-24.04", "arch": "x86_64",
               "environment": release + launch + '"' + ccache("/project")},
              {"name": "macOS ARM64", "os": "macos-15", "arch": "arm64",
               "environment": "MACOSX_DEPLOYMENT_TARGET=15.0 " + release + launch + '"'
                              + ccache("$GITHUB_WORKSPACE")},
              {"name": "macOS Intel", "os": "macos-15-intel", "arch": "x86_64",
               "environment": "MACOSX_DEPLOYMENT_TARGET=15.0 " + release + launch + '"'
                              + ccache("$GITHUB_WORKSPACE")},
              {"name": "Windows x86_64", "os": "windows-2025", "arch": "AMD64",
               "environment": "CMAKE_GENERATOR=Ninja " + release + ' -DLSDTT_PYTHON_OPENMP=OFF '
                              '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg-pinned/scripts/buildsystems/vcpkg.cmake '
                              '-DVCPKG_TARGET_TRIPLET=x64-windows $LSDTT_WINDOWS_LAUNCHER"'
                              + ccache("$GITHUB_WORKSPACE")},
          ]
          if os.environ["PLATFORMS"] == "linux":
              legs = legs[:1]
          elif os.environ["PLATFORMS"] == "windows":
              legs = [leg for leg in legs if leg["os"].startswith("windows")]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": legs}) + "\n")
          print("Building:", ", ".join(leg["name"] for leg in legs))
          PY

      - name: Check API contracts and documentation
        run: |
          python -m pip install \
            pytest \
            mkdocs==1.6.1 \
            mkdocs-material==9.7.7
          python python_bindings/tools/check_api_naming.py
          python python_bindings/tools/check_api_examples.py
          python python_bindings/tools/generate_api_reference.py --check
          PYTHONPATH=./python_bindings/src mkdocs build --strict

  build-wheels:
    name: ${{ matrix.name }} wheels
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-release.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up pinned vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:VCPKG_TAG https://github.com/microsoft/vcpkg $env:VCPKG_PINNED_ROOT
          & "$env:VCPKG_PINNED_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:VCPKG_PINNED_ROOT" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_TRIPLET" >> $env:GITHUB_ENV

      # vcpkg's archives are tied to the exact MSVC toolset, and the runner image
      # updates it every few weeks. Without it in the key, an update keeps
      # "hitting" a cache vcpkg can no longer use, rebuilds GDAL, and never
      # saves the result. Same step in all three workflows.
      - name: Read the MSVC toolset version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $ver = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          Write-Host "MSVC toolset $ver"
          "MSVC_TOOLS_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Restore Windows vcpkg cache
        if: runner.os == 'Windows'
        id: windows-vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~\AppData\Local\vcpkg\archives
            C:\vcpkg-pinned\downloads
          key: windows-vcpkg-${{ env.VCPKG_TAG }}-${{ env.VCPKG_TRIPLET }}-msvc${{ env.MSVC_TOOLS_VERSION }}-${{ hashFiles('.github/vcpkg-packages.txt') }}
          restore-keys: |
            windows-vcpkg-${{ env.VCPKG_TAG }}-${{ env.VCPKG_TRIPLET }}-msvc${{ env.MSVC_TOOLS_VERSION }}-
            windows-vcpkg-${{ env.VCPKG_TAG }}-${{ env.VCPKG_TRIPLET }}-
            windows-vcpkg-

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packages = Get-Content .github/vcpkg-packages.txt | Where-Object { $_ -and -not $_.StartsWith('#') }
          & "$env:VCPKG_PINNED_ROOT\vcpkg.exe" install --triplet $env:VCPKG_TRIPLET @packages

      # Ninja (below) needs the compiler on PATH: an x64 Visual Studio
      # developer environment, as for the Windows backend in release.yml.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      # ccache from its own pinned release. Sets LSDTT_WINDOWS_LAUNCHER (the
      # CMake launcher flags) only if ccache runs; otherwise it is empty and
      # the wheels build without a cache, exactly as before.
      - name: Install ccache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CCACHE_VERSION: "4.10.2"
        run: |
          $launcher = ""
          try {
            $name = "ccache-$env:CCACHE_VERSION-windows-x86_64"
            $zip = "$env:RUNNER_TEMP\$name.zip"
            Invoke-WebRequest "https://github.com/ccache/ccache/releases/download/v$env:CCACHE_VERSION/$name.zip" -OutFile $zip
            Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
            $exe = "$env:RUNNER_TEMP\$name\ccache.exe"
            $version = & $exe --version
            if ($LASTEXITCODE -eq 0) {
              Write-Host $version[0]
              $exe = $exe -replace '\\', '/'
              $launcher = "-DCMAKE_C_COMPILER_LAUNCHER=$exe -DCMAKE_CXX_COMPILER_LAUNCHER=$exe"
              "LSDTT_CCACHE_EXE=$exe" >> $env:GITHUB_ENV
            }
          } catch {
            Write-Host "::warning::ccache could not be installed; Windows wheels build without it: $_"
          }
          "LSDTT_WINDOWS_LAUNCHER=$launcher" >> $env:GITHUB_ENV
          Write-Host "launcher: '$launcher'"

      - name: Build and test wheels
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT: ${{ matrix.environment }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_BUILD_LINUX: bash {project}/python_bindings/tools/ci_ccache.sh
          CIBW_BEFORE_BUILD_MACOS: bash {project}/python_bindings/tools/ci_ccache.sh
          # --analyze-existing-exes: delvewheel renames ("mangles") every DLL it
          # bundles and by default rewrites only the extension modules to the new
          # names. The bundled CLIs (lsdtt3/bin/*.exe) would still ask for gdal.dll
          # and fail with STATUS_DLL_NOT_FOUND; this rewrites their imports too.
          # lsdtt3._cli puts lsdtt3.libs on PATH when it starts them.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: python -m delvewheel repair --analyze-existing-exes --add-path C:\\vcpkg-pinned\\installed\\x64-windows\\bin --wheel-dir {dest_dir} {wheel}
        run: |
          python -m pip install --upgrade pip cibuildwheel delvewheel
          python -m cibuildwheel python_bindings --output-dir wheelhouse

      - name: ccache statistics (Windows)
        if: always() && runner.os == 'Windows' && env.LSDTT_CCACHE_EXE != ''
        shell: pwsh
        run: '& $env:LSDTT_CCACHE_EXE --show-stats'

      - name: Save Windows vcpkg cache
        if: always() && runner.os == 'Windows' && steps.windows-vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~\AppData\Local\vcpkg\archives
            C:\vcpkg-pinned\downloads
          key: windows-vcpkg-${{ env.VCPKG_TAG }}-${{ env.VCPKG_TRIPLET }}-msvc${{ env.MSVC_TOOLS_VERSION }}-${{ hashFiles('.github/vcpkg-packages.txt') }}

      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.arch }}-${{ runner.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  upload-release:
    name: Upload wheels to the GitHub release
    # Upload whatever built: one failed platform must not withhold the other
    # platforms' wheels from the release (v0.9.1 shipped none because the
    # Windows leg failed). The failed leg still marks the run as failed.
    if: always() && inputs.upload && needs.prepare-release.result == 'success'
    needs:
      - prepare-release
      - build-wheels
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          merge-multiple: true
          path: release-assets

      # A .postN wheel goes to the release of its X.Y.Z stem. The release must
      # already exist (release.yml creates it from the vX.Y.Z tag).
      - name: Upload to the existing release
        env:
          RELEASE: ${{ needs.prepare-release.outputs.release }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          wheels=(release-assets/*.whl)
          if (( ${#wheels[@]} == 0 )); then
            echo "::error::no wheel built on any platform; nothing to upload"
            exit 1
          fi
          echo "Uploading ${#wheels[@]} wheel(s)"
          gh release view "${RELEASE}" >/dev/null
          # --clobber: a later "all" run for the same tag replaces the Linux
          # wheels a "linux" run already attached (same tag, same source).
          gh release upload --clobber "${RELEASE}" release-assets/*.whl
