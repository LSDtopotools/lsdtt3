name: Build Python wheels

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Python package version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: python-wheel-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Calculate Python release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require the default branch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            echo "Run Python releases from ${{ github.event.repository.default_branch }}." >&2
            exit 1
          fi

      - name: Record the release source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Calculate the Python package version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          path = Path("python_bindings/pyproject.toml")
          text = path.read_text()
          current = tomllib.loads(text)["project"]["version"]
          major, minor, patch = map(int, current.split("."))

          match os.environ["BUMP"]:
              case "patch":
                  patch += 1
              case "minor":
                  minor += 1
                  patch = 0
              case "major":
                  major += 1
                  minor = patch = 0
              case _:
                  raise ValueError("Unsupported version increment")

          version = f"{major}.{minor}.{patch}"
          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a") as output:
              output.write(f"version={version}\n")
              output.write(f"tag=python-v{version}\n")
          PY

  build-wheels:
    name: ${{ matrix.name }} wheels
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            arch: x86_64
            environment: CMAKE_ARGS="-DLSDTT_PYTHON_RELEASE_WHEEL=ON -DLSDTT_PYTHON_OPENCV=OFF"
          - name: macOS ARM64
            os: macos-15
            arch: arm64
            environment: MACOSX_DEPLOYMENT_TARGET=11.0 CMAKE_ARGS="-DLSDTT_PYTHON_RELEASE_WHEEL=ON -DLSDTT_PYTHON_OPENCV=OFF"
          - name: macOS Intel
            os: macos-15-intel
            arch: x86_64
            environment: MACOSX_DEPLOYMENT_TARGET=10.15 CMAKE_ARGS="-DLSDTT_PYTHON_RELEASE_WHEEL=ON -DLSDTT_PYTHON_OPENCV=OFF"
          - name: Windows x86_64
            os: windows-2025
            arch: AMD64
            environment: CMAKE_ARGS="-DLSDTT_PYTHON_RELEASE_WHEEL=ON -DLSDTT_PYTHON_OPENCV=OFF -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set the wheel package version
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("python_bindings/pyproject.toml")
          text = path.read_text()
          path.write_text(re.sub(
              r'(?m)^version = "[^"]+"$',
              f'version = "{os.environ["VERSION"]}"',
              text,
              count=1,
          ))
          PY

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\\vcpkg" }
          & "$root\\vcpkg.exe" install --triplet x64-windows gdal fftw3 netcdf-c eigen3
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_TRIPLET=x64-windows" >> $env:GITHUB_ENV

      - name: Build and test wheels
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT: ${{ matrix.environment }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: python -m delvewheel repair --add-path C:\\vcpkg\\installed\\x64-windows\\bin --wheel-dir {dest_dir} {wheel}
        run: |
          python -m pip install --upgrade pip cibuildwheel delvewheel
          python -m cibuildwheel python_bindings --output-dir wheelhouse

      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.arch }}-${{ runner.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-release:
    name: Create Python GitHub Release
    needs:
      - prepare-release
      - build-wheels
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          fetch-depth: 0

      - name: Commit the validated Python package version
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists." >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("python_bindings/pyproject.toml")
          text = path.read_text()
          path.write_text(re.sub(
              r'(?m)^version = "[^"]+"$',
              f'version = "{os.environ["VERSION"]}"',
              text,
              count=1,
          ))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python_bindings/pyproject.toml
          git commit -m "Release Python ${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          merge-multiple: true
          path: release-assets

      - name: Tag and publish the validated wheel release
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -a "${TAG}" -m "lsdtt3 Python ${VERSION}"
          git push origin "${TAG}"
          gh release create "${TAG}" release-assets/*.whl \
            --title "lsdtt3 Python ${VERSION}" \
            --generate-notes
