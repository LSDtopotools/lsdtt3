name: Build Python wheels

# Builds wheels for ONE existing lsdtt3 tag: Linux only (5 wheels, the cheap
# choice) or every platform (20 wheels; macOS runners bill at 10x and Windows
# at 2x the Linux rate on a private repository). Run by hand, and only
# for releases where the Python API is supported: lsdtt3 has one version number,
# but not every vX.Y.Z gets wheels. This workflow never bumps a version, commits
# or tags; tags are made by the maintainer (vX.Y.Z, or vX.Y.Z.postN for a
# wheel-only rebuild of the same source).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (vX.Y.Z or vX.Y.Z.postN)
        required: true
        type: string
      platforms:
        description: Which wheels to build (linux = Linux x86_64 only; all = Linux, macOS ARM64 and Intel, Windows)
        required: true
        type: choice
        options:
          - linux
          - all
        default: linux
      upload:
        description: Upload the wheels to the GitHub release vX.Y.Z (otherwise they stay workflow artefacts)
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: python-wheel-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Check the tag and the API contracts
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      release: ${{ steps.source.outputs.release }}
      matrix: ${{ steps.platforms.outputs.matrix }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      # The 'v' belongs to the tag only; every file stores the bare number.
      # CMake holds X.Y.Z; pyproject.toml holds X.Y.Z or X.Y.Z.postN.
      - name: Check the tag against the version files
        id: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(\.post[0-9]+)?$ ]]; then
            echo "Tag '${TAG}' is not vX.Y.Z or vX.Y.Z.postN." >&2
            exit 1
          fi
          stem="${BASH_REMATCH[1]}"
          cmake_version="$(sed -n 's/^project(lsdtt3 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          py_version="$(sed -n '/^\[project\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' python_bindings/pyproject.toml)"
          if [[ "${stem}" != "${cmake_version}" ]]; then
            echo "Tag ${TAG} has stem ${stem}, but its CMakeLists.txt says ${cmake_version}." >&2
            exit 1
          fi
          if [[ "${TAG#v}" != "${py_version}" ]]; then
            echo "Tag ${TAG} does not match its pyproject.toml version ${py_version}." >&2
            exit 1
          fi
          python3 tests/scripts/check_version_consistency.py --repo-root .
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "release=v${stem}" >> "${GITHUB_OUTPUT}"

      # The build matrix is chosen here rather than skipped per job: a matrix
      # job that is skipped still starts a runner, and a macOS runner bills at
      # 10x even for that.
      - name: Choose the platforms to build
        id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          python3 - <<'PY'
          import json, os
          release = 'CMAKE_ARGS="-DLSDTT_PYTHON_RELEASE_WHEEL=ON'
          legs = [
              {"name": "Linux x86_64", "os": "ubuntu-24.04", "arch": "x86_64",
               "environment": release + '"'},
              {"name": "macOS ARM64", "os": "macos-15", "arch": "arm64",
               "environment": "MACOSX_DEPLOYMENT_TARGET=15.0 " + release + '"'},
              {"name": "macOS Intel", "os": "macos-15-intel", "arch": "x86_64",
               "environment": "MACOSX_DEPLOYMENT_TARGET=15.0 " + release + '"'},
              {"name": "Windows x86_64", "os": "windows-2025", "arch": "AMD64",
               "environment": release + ' -DLSDTT_PYTHON_OPENMP=OFF '
                              '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake"'},
          ]
          if os.environ["PLATFORMS"] == "linux":
              legs = legs[:1]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": legs}) + "\n")
          print("Building:", ", ".join(leg["name"] for leg in legs))
          PY

      - name: Check API contracts and documentation
        run: |
          python -m pip install \
            pytest \
            mkdocs==1.6.1 \
            mkdocs-material==9.7.7
          python python_bindings/tools/check_api_naming.py
          python python_bindings/tools/check_api_examples.py
          python python_bindings/tools/generate_api_reference.py --check
          PYTHONPATH=./python_bindings/src mkdocs build --strict

  build-wheels:
    name: ${{ matrix.name }} wheels
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-release.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Windows vcpkg cache
        if: runner.os == 'Windows'
        id: windows-vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~\AppData\Local\vcpkg\archives
            C:\vcpkg\downloads
          key: windows-vcpkg-x64-${{ hashFiles('.github/workflows/python-wheels.yml') }}
          restore-keys: windows-vcpkg-x64-

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\\vcpkg" }
          & "$root\\vcpkg.exe" install --triplet x64-windows gdal fftw3 netcdf-c eigen3
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_TRIPLET=x64-windows" >> $env:GITHUB_ENV

      - name: Build and test wheels
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT: ${{ matrix.environment }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: python -m delvewheel repair --add-path C:\\vcpkg\\installed\\x64-windows\\bin --wheel-dir {dest_dir} {wheel}
        run: |
          python -m pip install --upgrade pip cibuildwheel delvewheel
          python -m cibuildwheel python_bindings --output-dir wheelhouse

      - name: Save Windows vcpkg cache
        if: always() && runner.os == 'Windows' && steps.windows-vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~\AppData\Local\vcpkg\archives
            C:\vcpkg\downloads
          key: windows-vcpkg-x64-${{ hashFiles('.github/workflows/python-wheels.yml') }}

      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.arch }}-${{ runner.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  upload-release:
    name: Upload wheels to the GitHub release
    if: inputs.upload
    needs:
      - prepare-release
      - build-wheels
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          merge-multiple: true
          path: release-assets

      # A .postN wheel goes to the release of its X.Y.Z stem. The release must
      # already exist (release.yml creates it from the vX.Y.Z tag).
      - name: Upload to the existing release
        env:
          RELEASE: ${{ needs.prepare-release.outputs.release }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${RELEASE}" >/dev/null
          # --clobber: a later "all" run for the same tag replaces the Linux
          # wheels a "linux" run already attached (same tag, same source).
          gh release upload --clobber "${RELEASE}" release-assets/*.whl
