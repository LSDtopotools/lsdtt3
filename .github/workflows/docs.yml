name: Documentation site

# Builds the MkDocs site and publishes it to GitHub Pages at
# https://lsdtopotools.github.io/lsdtt3/
#
# Dormant while the repository is private: every job is skipped (a skipped
# job uses no Actions minutes), because Pages from a private repository needs
# a paid plan and CI minutes are metered. It starts deploying on its own once
# the repository is public. One-off setup at that point:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# See docs/developer_notes/building_the_docs.md.
#
# Triggers:
#   - push to main that touches the site sources
#   - manual run from the Actions tab

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "qgis_plugin/README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same pins as the documentation check in release.yml.
      - name: Install documentation dependencies
        run: >-
          python3 -m pip install
          mkdocs==1.6.1
          mkdocs-material==9.7.7

      # --strict: broken internal links fail the build instead of 404ing.
      - name: Build site
        run: PYTHONPATH=./python_bindings/src mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
