name: Check Python API

on:
  pull_request:
    paths:
      - "python_bindings/**"
      - "src/**"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/python-api.yml"
  push:
    branches:
      - main
    paths:
      - "python_bindings/**"
      - "src/**"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/python-api.yml"

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libgdal-dev libfftw3-dev libeigen3-dev libnetcdf-dev libgomp1

      - name: Build and install Python package
        env:
          CMAKE_ARGS: -DLSDTT_PYTHON_OPENCV=OFF
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest mkdocs mkdocs-material mkdocstrings-python ./python_bindings

      - name: Check runtime API
        run: |
          python -m pytest -q python_bindings/tests
          python python_bindings/tools/generate_public_api_manifest.py --check
          python python_bindings/tools/check_api_naming.py
          python python_bindings/tools/generate_documentation_exclusions.py --check
          python python_bindings/tools/generate_documentation_signature_contract.py --check
          python python_bindings/tools/check_api_examples.py
          python python_bindings/tools/check_llm_cards.py
          PYTHONPATH=./python_bindings/src mkdocs build --strict
