name: Build and release

# Builds every release artefact that can be built in CI, on version tags only.
# Ordinary pushes and pull requests build nothing.
#
# Triggers:
#   - push of a version tag (git tag -a v0.9.0 -m "lsdtt3 0.9.0" && git push origin v0.9.0)
#     -> builds everything below and attaches it to the GitHub release
#   - manual run from the Actions tab
#     -> builds the backends and the plugin zip as 14-day workflow artefacts;
#        creates no release and builds no wheels (those need a tag)
#
# Order: the Linux job runs first and creates the release as a DRAFT. Nothing
# else starts unless it succeeds, so a broken tag fails once, cheaply, on Linux:
#
#   build-linux ──┬── build-windows (qgis) ──┐
#   (core bundle, ├── build-macos (qgis,     ├── python-wheels (Linux, macOS
#    plugin zip,  │   arm64 + x86_64)        │    arm64 + x86_64, Windows)
#    draft        │                          │
#    release)     └──────────────────────────┴── publish-release
#                                                     │
#                          publish-testpypi ──── publish-pypi
#                          (only if every wheel built and the release published)
#
# publish-release runs last, once every job has finished: it removes the
# previous releases' unversioned copies and publishes the draft as Latest. So
# the releases/latest/download/<name> links, and anything that installs "the
# latest release" (notebooks, the install docs), switch to the new version
# only when all its files are attached, never to a half-filled release.
#
# The wheels wait for the Windows backend because both use the same pinned
# vcpkg binary cache: when that cache is cold (first release, or after a
# VCPKG_TAG bump) GDAL builds from source once instead of twice in parallel.
# The wheels still run if the Windows backend fails.
#
# Windows and macOS ship the qgis CLI profile only (tools/cli_profiles.txt):
# the backend the QGIS plugin drives. Full CLI use on those platforms is
# through WSL2 (Windows) or a Linux VM (macOS) with the Linux bundle.
#
# PyPI: publish-testpypi uploads the four wheels to TestPyPI, then
# publish-pypi uploads the same files to PyPI, through trusted publishing
# (no token stored; the publishers name this workflow and the environments
# testpypi and pypi). Both run only when every wheel built: a version reaches
# PyPI with all its platforms or not at all, and the missing upload is done by
# a manual python-wheels.yml run (publish_to) instead. A required reviewer on
# the pypi environment (repository settings) makes the PyPI upload wait for
# approval, so the TestPyPI files can be tried first. See
# docs/developer_notes/publishing_to_pypi.md.
#
# vX.Y.Z.postN tags are wheel-only rebuilds of the same source: they run only
# python-wheels.yml (by hand), never this workflow.
#
# See tools/README.md for the release cheat sheet and
# docs/developer_notes/making_release_packages.md for why it is built this way.

on:
  push:
    tags:
      - "v*"
      - "!v*.post*"
  workflow_dispatch:

# Explicit, because a repository's default GITHUB_TOKEN may be read-only, and
# creating a release and uploading assets need contents: write.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Kept identical to python-wheels.yml and vcpkg-cache.yml so the Windows
# backend and the Windows wheel share one vcpkg binary cache. Change all three
# together. The cache a tag run restores is the one vcpkg-cache.yml keeps on
# main: caches saved by a tag run are visible only to that same tag.
env:
  VCPKG_TAG: "2026.10.16"
  VCPKG_PINNED_ROOT: 'C:\vcpkg-pinned'
  VCPKG_TRIPLET: x64-windows

jobs:
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux backend, QGIS plugin, release
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # Full history + tags so the LSDTT3_VERSION git describe string and
      # the driver's exact-tag check both work.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve the release version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Manual dispatch: no tag, so build at the current CMake version.
            VERSION="$(sed -n 's/^project(lsdtt3 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          fi
          echo "Building release version: ${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      # The runner's default Ubuntu mirror first (azure.archive.ubuntu.com,
      # listed in /etc/apt/apt-mirrors.txt), then archive.ubuntu.com if it
      # fails. apt does not move to the next mirror in that file by itself
      # when a name will not resolve: it counts that as a temporary error and
      # retries the same mirror for every package (v0.9.4: over an hour of
      # "Temporary failure resolving 'azure.archive.ubuntu.com'", then a
      # failed step). So the timeouts are short, a failed update or install
      # switches the mirror list explicitly and tries once more, and the step
      # gives up after 30 minutes rather than using the job's 120.
      - name: Install dependencies
        timeout-minutes: 30
        run: |
          packages=(
            cmake build-essential pkg-config
            libgdal-dev
            libfftw3-dev
            libeigen3-dev
            libnetcdf-dev
            libgomp1
            patchelf
            python3-pip
            python3-venv
            python3-dev
          )
          apt_opts=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)

          # apt-get update exits 0 even when indexes fail to download, so
          # read its output as well.
          apt_update() {
            sudo apt-get update -qq "${apt_opts[@]}" 2>&1 | tee apt-update.log
            ! grep -qE 'Failed to fetch|Temporary failure resolving|Could not resolve' apt-update.log
          }
          apt_install() {
            sudo apt-get install -y "${apt_opts[@]}" "${packages[@]}"
          }

          if apt_update && apt_install; then
            exit 0
          fi

          echo "::warning::The runner's default Ubuntu mirror failed; switching to archive.ubuntu.com"
          printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://security.ubuntu.com/ubuntu/\tpriority:2\n' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          apt_update || echo "::warning::apt-get update still reports failures; trying the install anyway"
          apt_install

      - name: Install documentation dependencies
        run: >-
          python3 -m pip install
          mkdocs==1.6.1
          mkdocs-material==9.7.7

      # The same driver script used for local releases: configure, build,
      # smoke-check, run the Python bindings tests, and package the
      # self-contained backend bundle.
      - name: Build and package the Linux backend
        run: tools/make_release.sh --version "${{ steps.version.outputs.version }}"

      - name: Check CLI references and documentation
        run: |
          python3 tools/generate_cli_reference.py --check --bin-dir build/release
          PYTHONPATH=./python_bindings/src mkdocs build --strict

      # Pure Python, seconds. Its version comes from metadata.txt, which the
      # version-consistency check in make_release.sh has already compared
      # with CMakeLists.txt.
      - name: Package the QGIS plugin
        run: python3 qgis_plugin/package_plugin.py --out-dir dist

      # Unversioned copies, so the documentation can give one permanent link
      # per artefact: https://github.com/<repo>/releases/latest/download/<name>
      # always serves the newest release. The archives' top-level folders keep
      # their versioned names. The Windows and macOS jobs do the same.
      - name: Make unversioned copies for the latest-release links
        run: |
          cp dist/lsdtt3-backend-linux-x86_64-core-v*.tar.gz dist/lsdtt3-backend-linux-x86_64-core.tar.gz
          cp dist/lsdtt3-qgis-plugin-[0-9]*.zip dist/lsdtt3-qgis-plugin.zip
          ls -l dist

      # Auto-generated notes only credit pull requests, so direct commits to
      # main are invisible. Prepend a commit-author roll-call so everyone who
      # committed since the previous tag appears in the notes.
      - name: Write commit roll-call for release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # .postN tags are wheel-only rebuilds, not releases: skip them so the
          # notes cover everything since the previous vX.Y.Z.
          prev="$(git describe --tags --abbrev=0 --match 'v*' --exclude '*.post*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [[ -n "$prev" ]]; then
            range="${prev}..${GITHUB_REF_NAME}"
            since="since ${prev}"
          else
            range="${GITHUB_REF_NAME}"
            since="in this release"
          fi
          # lsdtt3 has one version number, so every component is released under
          # this tag. Say which ones changed, so users of an unchanged one know
          # they can skip the update.
          component() {
            if git diff --quiet "${prev:-$(git rev-list --max-parents=0 HEAD | tail -1)}" "${GITHUB_REF_NAME}" -- "${@:2}"; then
              echo "- **$1:** no changes (rebuilt)"
            else
              echo "- **$1:** changed ${since}"
            fi
          }
          {
            echo "## Components"
            echo ""
            component "C++ core and CLIs" src cli CMakeLists.txt
            component "Python bindings" python_bindings
            component "QGIS plugin" qgis_plugin
            echo ""
            echo "## Artefacts"
            echo ""
            echo "Attached by the release workflow:"
            echo ""
            echo "- Linux x86_64 backend bundle, \`core\` profile"
            echo "- Windows x64 and macOS (arm64, x86_64) backend bundles, \`qgis\` profile:"
            echo "  the backend for the QGIS plugin. For the full CLI set on Windows or"
            echo "  macOS, use the Linux bundle under WSL2 or a Linux VM."
            echo "- QGIS plugin zip"
            echo "- Python wheels for Linux, macOS and Windows"
            echo ""
            echo "Built locally from this tag and attached by hand: the Debian and conda"
            echo "packages (docs/developer_notes/making_release_packages.md)."
            echo ""
            echo "## Commit authors ${since}"
            echo ""
            git shortlog -sn "$range" | while read -r count author; do
              echo "- ${author} (${count} commits)"
            done
            echo ""
          } > release_rollcall.md
          cat release_rollcall.md

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/lsdtt3-backend-linux-*.tar.gz
            dist/lsdtt3-qgis-plugin*.zip
          body_path: release_rollcall.md
          generate_release_notes: true
          # Published by the publish-release job at the end, once every
          # artefact is attached. Until then "latest" stays on the previous
          # release.
          draft: true

      - name: Upload as workflow artefact (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v5
        with:
          name: lsdtt3-linux-and-plugin
          path: |
            dist/lsdtt3-backend-linux-*.tar.gz
            dist/lsdtt3-qgis-plugin-*.zip
          retention-days: 14

  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows backend (qgis)
    needs: build-linux
    runs-on: windows-2025
    # A cold vcpkg cache builds GDAL from source: hours, once per VCPKG_TAG.
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pinned vcpkg
        run: |
          git clone --depth 1 --branch $env:VCPKG_TAG https://github.com/microsoft/vcpkg $env:VCPKG_PINNED_ROOT
          & "$env:VCPKG_PINNED_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:VCPKG_PINNED_ROOT" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_TRIPLET" >> $env:GITHUB_ENV

      # Same paths and key as python-wheels.yml: one cache serves both.
      # vcpkg's archives are tied to the exact MSVC toolset, and the runner image
      # updates it every few weeks. Without it in the key, an update keeps
      # "hitting" a cache vcpkg can no longer use, rebuilds GDAL, and never
      # saves the result. Same step in all three workflows.
      - name: Read the MSVC toolset version
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $ver = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          Write-Host "MSVC toolset $ver"
          "MSVC_TOOLS_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~\AppData\Local\vcpkg\archives
            C:\vcpkg-pinned\downloads
          key: windows-vcpkg-${{ env.VCPKG_TAG }}-${{ env.VCPKG_TRIPLET }}-msvc${{ env.MSVC_TOOLS_VERSION }}-${{ hashFiles('.github/vcpkg-packages.txt') }}
          restore-keys: |
            windows-vcpkg-${{ env.VCPKG_TAG }}-${{ env.VCPKG_TRIPLET }}-msvc${{ env.MSVC_TOOLS_VERSION }}-
            windows-vcpkg-${{ env.VCPKG_TAG }}-${{ env.VCPKG_TRIPLET }}-
            windows-vcpkg-

      - name: Install native dependencies
        run: |
          $packages = Get-Content .github/vcpkg-packages.txt | Where-Object { $_ -and -not $_.StartsWith('#') }
          & "$env:VCPKG_PINNED_ROOT\vcpkg.exe" install --triplet $env:VCPKG_TRIPLET @packages
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      - name: Save vcpkg cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~\AppData\Local\vcpkg\archives
            C:\vcpkg-pinned\downloads
          key: windows-vcpkg-${{ env.VCPKG_TAG }}-${{ env.VCPKG_TRIPLET }}-msvc${{ env.MSVC_TOOLS_VERSION }}-${{ hashFiles('.github/vcpkg-packages.txt') }}

      # The packaging script needs dumpbin and VCToolsRedistDir, i.e. an x64
      # Visual Studio developer environment, exactly as for a local build.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: python -m pip install ninja

      # The flags of the documented Windows flow (building_on_windows.md, and
      # the -Tag path of package_windows_backend.ps1): no OpenMP (MSVC's is
      # OpenMP 2.0), no Eigen, so the reduced qgis bundle.
      - name: Configure
        run: |
          cmake -S . -B build/windows-qgis -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_PINNED_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET" `
            -DBUILD_TESTING=OFF -DLSDTT_OPENMP=OFF -DLSDTT_EIGEN=OFF `
            -DLSDTT_GPU=OFF `
            -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }

      - name: Build the qgis CLIs
        run: |
          $clis = Get-Content tools/cli_profiles.txt |
            Where-Object { $_ -notmatch '^\s*(#|$)' } |
            ForEach-Object { $p = $_ -split '\s+'; if ($p[0] -eq 'qgis') { $p[1] } }
          cmake --build build/windows-qgis --target @clis
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Package
        run: |
          .\tools\package_windows_backend.ps1 `
            -Version "${{ needs.build-linux.outputs.version }}" `
            -BuildDir build/windows-qgis `
            -VcpkgRoot $env:VCPKG_PINNED_ROOT `
            -Triplet $env:VCPKG_TRIPLET

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Plus an unversioned copy for the permanent latest-release link.
          $zip = (Get-ChildItem dist/lsdtt3-backend-win64-qgis-v*.zip).FullName
          Copy-Item $zip dist/lsdtt3-backend-win64-qgis.zip
          gh release upload --clobber "${{ github.ref_name }}" $zip dist/lsdtt3-backend-win64-qgis.zip
          if ($LASTEXITCODE -ne 0) { throw "upload failed" }

      - name: Upload as workflow artefact (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v5
        with:
          name: lsdtt3-backend-windows
          path: dist/lsdtt3-backend-win64-*.zip
          retention-days: 14

  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS backend (qgis, ${{ matrix.arch }})
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          # A bundle runs on the macOS release it was built on and newer:
          # Homebrew bottles target the runner's macOS. Same runners as the
          # wheels (python-wheels.yml).
          - arch: arm64
            os: macos-15
          - arch: x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Same list as docs/developer_notes/building_on_macos.md. Only what is
      # missing: the runner image already has cmake and pkgconf, and brew
      # prints a warning for every formula that is already installed.
      - name: Install dependencies
        run: |
          for formula in cmake gdal fftw libomp netcdf eigen pkgconf; do
            brew list --formula "$formula" >/dev/null 2>&1 || brew install "$formula"
          done

      - name: Configure
        run: |
          cmake -S . -B build/macos-qgis -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            | tee configure.log

      # A missing optional dependency is a CMake STATUS line, never an error,
      # so say it loudly in the run summary. Not fatal: a single-threaded or
      # FFTW-less qgis bundle still works, and debugging a release in CI is
      # what this workflow is meant to avoid.
      - name: Report optional dependencies
        run: |
          for dep in OpenMP FFTW3 Eigen3; do
            if grep -Eq "^-- +${dep} +: ON" configure.log; then
              echo "${dep}: ON"
            else
              echo "::warning title=macOS ${{ matrix.arch }}::${dep} is OFF in the macOS build (see the Configure step)"
            fi
          done
          grep -q "netCDF-C found" configure.log \
            || echo "::warning title=macOS ${{ matrix.arch }}::netCDF-C not found in the macOS build"

      - name: Build the qgis CLIs
        run: |
          clis=$(awk '$1 == "qgis" { print $2 }' tools/cli_profiles.txt)
          # shellcheck disable=SC2086
          cmake --build build/macos-qgis -j"$(sysctl -n hw.ncpu)" --target ${clis}

      - name: Package
        run: |
          tools/package_macos_backend.sh \
            --version "${{ needs.build-linux.outputs.version }}" \
            --build-dir build/macos-qgis \
            --cli-profile qgis \
            --arch "${{ matrix.arch }}"
          ls -lh dist/*.tar.gz

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Plus an unversioned copy for the permanent latest-release link.
          cp dist/lsdtt3-backend-macos-${{ matrix.arch }}-qgis-v*.tar.gz \
             dist/lsdtt3-backend-macos-${{ matrix.arch }}-qgis.tar.gz
          gh release upload --clobber "${GITHUB_REF_NAME}" dist/lsdtt3-backend-macos-*.tar.gz

      - name: Upload as workflow artefact (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v5
        with:
          name: lsdtt3-backend-macos-${{ matrix.arch }}
          path: dist/lsdtt3-backend-macos-*.tar.gz
          retention-days: 14

  # ---------------------------------------------------------------------------
  python-wheels:
    name: Python wheels
    needs:
      - build-linux
      - build-windows
    # Wheels need a tag (python-wheels.yml checks it against the version
    # files). Run even if the Windows backend failed: only Linux must pass.
    if: >-
      always()
      && needs.build-linux.result == 'success'
      && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/python-wheels.yml
    with:
      tag: ${{ github.ref_name }}
      platforms: all
      upload: true
    # id-token: python-wheels.yml's own publish-pypi job (manual runs only)
    # asks for it, and GitHub checks a called workflow's permissions when the
    # run starts, even for a job that will be skipped. Without it every tag
    # run fails before starting. That job never runs from here.
    permissions:
      contents: write
      id-token: write

  # ---------------------------------------------------------------------------
  # Last: tidy the old releases and publish this one.
  #
  # Each release carries an unversioned copy of every backend bundle and the
  # plugin zip (about 260 MB) for the permanent releases/latest/download/<name>
  # links. Those links only ever resolve to the Latest release, so the copies on
  # older releases are never served; this deletes them. The versioned files on
  # old releases are kept. The list is explicit, so nothing else (wheels, or the
  # unversioned-looking files of very early releases) is ever touched.
  #
  # It publishes even if a Windows or macOS job failed, as long as Linux built:
  # a missing platform is then fixed by re-running that job or, for wheels, a
  # vX.Y.Z.postN wheel-only rebuild, which uploads to this (published) release.
  publish-release:
    name: Publish the release
    needs:
      - build-linux
      - build-windows
      - build-macos
      - python-wheels
    if: >-
      always()
      && needs.build-linux.result == 'success'
      && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LATEST_COPIES: >-
        lsdtt3-backend-linux-x86_64-core.tar.gz
        lsdtt3-backend-win64-qgis.zip
        lsdtt3-backend-macos-arm64-qgis.tar.gz
        lsdtt3-backend-macos-x86_64-qgis.tar.gz
        lsdtt3-qgis-plugin.zip
    steps:
      - name: Remove unversioned copies from older releases
        run: |
          gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
            --jq ".[] | select(.tag_name != \"${GITHUB_REF_NAME}\") | .tag_name as \$t | .assets[] | \"\(.id) \(\$t) \(.name)\"" |
          while read -r id tag name; do
            for copy in ${LATEST_COPIES}; do
              if [[ "${name}" == "${copy}" ]]; then
                echo "Deleting ${tag}/${name}"
                gh api -X DELETE "repos/${GH_REPO}/releases/assets/${id}"
              fi
            done
          done

      - name: Publish the draft as the latest release
        run: |
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
          gh release view "${GITHUB_REF_NAME}" --json url,isDraft,assets \
            --jq '"\(.url) draft=\(.isDraft) assets=\(.assets | length)"'

  # ---------------------------------------------------------------------------
  # Last of all: the wheels to TestPyPI, then the same files to PyPI.
  #
  # python-wheels succeeds only if every platform leg built and its wheels were
  # attached to the release, so these never upload a partial set. They wait for
  # publish-release so the GitHub release is public before the PyPI one.
  # An index accepts each version once (skip-existing makes a re-run of a job
  # harmless); check_dist_wheels.py refuses a wrong set before anything is sent.
  publish-testpypi:
    name: Upload the wheels to TestPyPI
    needs:
      - python-wheels
      - publish-release
    if: >-
      always()
      && needs.python-wheels.result == 'success'
      && needs.publish-release.result == 'success'
      && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/lsdtt3/
    permissions:
      contents: read
      id-token: write   # trusted publishing (OIDC); no token is stored
    steps:
      - uses: actions/checkout@v5
        with:
          path: source
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Check the wheels
        run: |
          python3 source/python_bindings/tools/check_dist_wheels.py --dir dist --tag "${GITHUB_REF_NAME}"
          python3 -m pip install --quiet twine
          python3 -m twine check --strict dist/*.whl
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Upload the wheels to PyPI
    needs:
      - python-wheels
      - publish-release
      - publish-testpypi
    if: >-
      always()
      && needs.python-wheels.result == 'success'
      && needs.publish-release.result == 'success'
      && needs.publish-testpypi.result == 'success'
      && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/lsdtt3/
    permissions:
      contents: read
      id-token: write   # trusted publishing (OIDC); no token is stored
    steps:
      - uses: actions/checkout@v5
        with:
          path: source
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Check the wheels
        run: |
          python3 source/python_bindings/tools/check_dist_wheels.py --dir dist --tag "${GITHUB_REF_NAME}"
          python3 -m pip install --quiet twine
          python3 -m twine check --strict dist/*.whl
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
