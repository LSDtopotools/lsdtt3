name: Build and release

# Runs ONLY on version tags (plus manual dispatch) to keep private-repo
# Actions minutes to one Linux build per official release. Local test
# releases use tools/make_release.sh directly and cost no minutes.
# See tools/README.md for the full release workflow.
#
# Triggers:
#   - push of a version tag (e.g. git tag v0.3.0 && git push origin v0.3.0)
#     -> builds the backend bundle and attaches it to the GitHub Release
#   - manual run from the Actions tab
#     -> builds the bundle and uploads it as a workflow artifact only
#
# vX.Y.Z.postN tags are wheel-only rebuilds of the same source: they run only
# python-wheels.yml (by hand), never this workflow.

on:
  push:
    tags:
      - "v*"
      - "!v*.post*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      # Full history + tags so the LSDTT3_VERSION git describe string and
      # the driver's exact-tag check both work.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libgdal-dev \
            libfftw3-dev \
            libeigen3-dev \
            libnetcdf-dev \
            libgomp1 \
            patchelf \
            python3-pip \
            python3-venv \
            python3-dev

      - name: Install documentation dependencies
        run: >-
          python3 -m pip install
          mkdocs==1.6.1
          mkdocs-material==9.7.7

      # The same driver script used for local releases: configure, build,
      # smoke-check, and package the self-contained backend bundle.
      - name: Build and package
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Manual dispatch: no tag, so build at the current CMake version.
            VERSION="$(sed -n 's/^project(lsdtt3 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          fi
          echo "Building release version: ${VERSION}"
          tools/make_release.sh --version "${VERSION}"

      - name: Check CLI references and documentation
        run: |
          python3 tools/generate_cli_reference.py --check --bin-dir build/release
          PYTHONPATH=./python_bindings/src mkdocs build --strict

      # Auto-generated notes only credit pull requests, so direct commits to
      # main are invisible. Prepend a commit-author roll-call so everyone who
      # committed since the previous tag appears in the notes.
      - name: Write commit roll-call for release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # .postN tags are wheel-only rebuilds, not releases: skip them so the
          # notes cover everything since the previous vX.Y.Z.
          prev="$(git describe --tags --abbrev=0 --match 'v*' --exclude '*.post*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [[ -n "$prev" ]]; then
            range="${prev}..${GITHUB_REF_NAME}"
            since="since ${prev}"
          else
            range="${GITHUB_REF_NAME}"
            since="in this release"
          fi
          # lsdtt3 has one version number, so every component is released under
          # this tag. Say which ones changed, so users of an unchanged one know
          # they can skip the update.
          component() {
            if git diff --quiet "${prev:-$(git rev-list --max-parents=0 HEAD | tail -1)}" "${GITHUB_REF_NAME}" -- "${@:2}"; then
              echo "- **$1:** no changes (rebuilt)"
            else
              echo "- **$1:** changed ${since}"
            fi
          }
          {
            echo "## Components"
            echo ""
            component "C++ core and CLIs" src cli CMakeLists.txt
            component "Python bindings" python_bindings
            component "QGIS plugin" qgis_plugin
            echo ""
            echo "## Artefacts"
            echo ""
            echo "- Linux backend bundle: attached by this workflow."
            echo "- Debian package, conda package, QGIS plugin zip, Windows and macOS"
            echo "  bundles: built locally from this tag and attached by hand"
            echo "  (docs/developer_notes/making_release_packages.md)."
            echo "- Python wheel: not built for this release, unless attached later"
            echo "  by a manual python-wheels.yml run."
            echo ""
            echo "## Commit authors ${since}"
            echo ""
            git shortlog -sn "$range" | while read -r count author; do
              echo "- ${author} (${count} commits)"
            done
            echo ""
          } > release_rollcall.md
          cat release_rollcall.md

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/lsdtt3-backend-linux-*.tar.gz
          body_path: release_rollcall.md
          generate_release_notes: true

      - name: Upload as workflow artifact (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v5
        with:
          name: lsdtt3-backend-linux
          path: dist/lsdtt3-backend-linux-*.tar.gz
          retention-days: 14
