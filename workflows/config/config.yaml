workflow_name: "check_basins"
run_id: "check-basins-example"

stages:
  fetch: true
  preprocess: true
  extract: true
  analyze: false
  report: true

fetch:
  dem_source: "cop30_aws"
  west: 10.3373594105
  south: 46.4568810636
  east: 10.4626405895
  north: 46.5431189364
  target_epsg: 32632
  grid_spacing: 30.0
  size_pixels: 256
  http_connect_timeout_seconds: 10
  http_timeout_seconds: 60

extract:
  minimum_basin_count: 4
  source_pixels_threshold: 1000
  max_search_stream_order: 20

analysis:
  module: "check_basins"

check_basins:
  outlets_file: "../tests/data/cosmo_tiny_points.csv"
  source_pixels_threshold: 20
  basin_outlet_snapping_method: "downstream"
  basin_outlet_contributing_pixels_threshold: 20
  basin_outlet_min_search_radius_pixels: 0
  basin_outlet_max_search_radius_pixels: 25
  write_basin_outlet_points: true

cosmo_landslides:
  landslide_mode: "single_event"
  threshold_contributing_pixels: 1000
  event_volume_m3: 1000000.0
  event_time_yr: 0.0
  random_seed: 7
  calculate_crn_concentration: true
  nuclide: "Be10"
  muon_scheme: "BraucherBorchers"
  scaling_scheme: "uniform"
  background_eff_erate_g_cm2_yr: 0.001
  production_scaling: 1.0
  total_shielding: 1.0
  crn_report_time_yr: 1000.0

synthetic_network:
  n_rows: 128
  n_cols: 128
  cell_size: 30.0
  domain_type: "noise_island"
  outlet_mode: "auto"
  island_fill_fraction: 0.7
  energy_exponent_gamma: 0.5
  random_seed: 11

cosmo_step_change:
  step_change_uplift_old_m_yr: 0.0001
  step_change_uplift_new_m_yr: 0.0005
  step_change_target_relief_m: 400.0
  step_change_age_yr: 1000000.0
  step_change_n: 1.0
  step_change_channel_pixels: 20
  muon_scheme: "BraucherBorchers"
  scaling_scheme: "stone"
  atmosphere: "ERA40"
  topo_shield_value: 1.0

executables:
  fetch_raster: "../build/lsdtt-fetch-raster"
  raster_preprocessing: "../build/lsdtt-raster-preprocessing"
  basin_extraction: "../build/lsdtt-basin-extraction"
  cosmo_landslides: "../build/lsdtt-cosmo-landslides"
  synthetic_network: "../build/lsdtt-synthetic-networks"
  cosmo_prediction: "../build/lsdtt-cosmo-prediction"

io:
  root: "results"
  manifests_dir: "manifests"
