site_name: LSDTopoTools3
site_description: Topographic analysis tools for geomorphology
site_author: Simon M. Mudd
repo_url: https://github.com/LSDtopotools/lsdtt3
repo_name: LSDtopotools/lsdtt3
docs_dir: docs
use_directory_urls: false

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: deep orange
      media: "(prefers-color-scheme: dark)"
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: deep orange
      media: "(prefers-color-scheme: light)"
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

# Working documents that live under docs/ for convenience but are not part of
# the published site. Without this they would build as orphan pages: internal
# planning notes and LaTeX sources are not user documentation.
exclude_docs: |
  plan_docs/
  tex_technical/
  test_scripts/

nav:
  - Home: index.md
  - What is lsdtt3:
    - Overview: overview.md
    - Workflows: workflows.md
    - Flow routing: flow_routing.md
    - Worked example - internal drainage: internal_drainage_workflow.md
    - Surface metrics: surface_metrics.md
  - Installation:
    - Install lsdtt3: install_lsdtt3.md
  - Command-line reference:
    - DEM preparation:
      - Fetch a DEM: cli_reference/cli_reference_lsdtt_fetch_raster.md
      - Raster preprocessing: cli_reference/cli_reference_lsdtt_raster_preprocessing.md
    - Surface analysis:
      - Surface metrics: cli_reference/cli_reference_lsdtt_surface_metrics.md
      - Mountain front: cli_reference/cli_reference_lsdtt_mountain_front.md
    - Flow routing and drainage:
      - Drainage analysis: cli_reference/cli_reference_lsdtt_drainage_analysis.md
      - Channel extraction: cli_reference/cli_reference_lsdtt_channel_extraction.md
      - Water line repair: cli_reference/cli_reference_lsdtt_water_line_repair.md
      - Stream burning: cli_reference/cli_reference_lsdtt_stream_burning.md
      - Valley centreline: cli_reference/cli_reference_lsdtt_valley_centreline.md
      - Basin extraction: cli_reference/cli_reference_lsdtt_basin_extraction.md
      - Basin statistics: cli_reference/cli_reference_lsdtt_basin_stats.md
      - Internal drainage: cli_reference/cli_reference_lsdtt_internal_drainage.md
    - Channel network analysis:
