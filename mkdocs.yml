site_name: LSDTopoTools3
site_description: Topographic analysis tools for geomorphology
site_author: Simon M. Mudd
repo_url: https://github.com/LSDtopotools/lsdtt3
repo_name: LSDtopotools/lsdtt3
docs_dir: docs
use_directory_urls: false

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: deep orange
      media: "(prefers-color-scheme: dark)"
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: deep orange
      media: "(prefers-color-scheme: light)"
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            # Public native objects are documented through a source-only
            # Python façade. This retains accurate Python signatures and
            # NumPy-style prose without importing or altering the extension.
            paths:
              - python_bindings/src
            force_inspection: false
            docstring_style: numpy
            docstring_options:
              # Nanobind exposes rendered signatures dynamically. Griffe can
              # read the docstrings but not every parameter name, so this
              # structural check would otherwise produce false warnings.
              warn_unknown_params: false
            # API pages are written around the public ``lsdtt3`` namespace;
            # hide the implementation-only ``_core`` collector path.
            filters:
              - "!^__.*"
            show_root_full_path: false
            show_signature_annotations: false
            show_source: false

# Working documents that live under docs/ for convenience but are not part of
# the published site. Without this they would build as orphan pages: internal
# planning notes and LaTeX sources are not user documentation.
exclude_docs: |
  plan_docs/
  tex_technical/
  test_scripts/
  cli_helper_function_audit.md
  cli_parameter_consistency_audit.md

