site_name: LSDTopoTools3
site_description: Topographic analysis tools for geomorphology
site_author: Simon M. Mudd
site_url: https://lsdtopotools.github.io/lsdtt3/
repo_url: https://github.com/LSDtopotools/lsdtt3
repo_name: LSDtopotools/lsdtt3
docs_dir: docs
use_directory_urls: false

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: deep orange
      media: "(prefers-color-scheme: dark)"
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: deep orange
      media: "(prefers-color-scheme: light)"
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - pymdownx.snippets:
      base_path: .
      check_paths: true

# Working documents that live under docs/ for convenience but are not part of
# the published site. Without this they would build as orphan pages: internal
# planning notes and LaTeX sources are not user documentation.
exclude_docs: |
  plan_docs/
  tex_technical/
  test_scripts/
  cli_helper_function_audit.md
  cli_parameter_consistency_audit.md

