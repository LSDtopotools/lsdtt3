[workspace]
name = "lsdtt3"
version = "0.4.0"
description = "Python environment for lsdtt3 test tooling and the python_helpers scripts."
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

# -----------------------------------------------------------------------------
# The C++ build is driven by CMake and does NOT need pixi.  This manifest exists
# only for the Python side of the repository:
#
#   python_helpers/   user-facing helpers (DEM download, raster -> PNG, OSM and
#                     geology vector downloads)
#   tests/scripts/    test orchestration (fixture fetch, CLI smoke runner,
#                     reference-data fetch, benchmark drivers)
#
# Users commonly have lsdviztools3 alongside lsdtt3, which also uses pixi on the
# conda-forge channel, so the two environments compose the same way.
#
#   pixi install                 # default environment
#   pixi run python python_helpers/download_dem_tiles.py --help
#   pixi shell                   # interactive
#   pixi install -e test         # the CTest Python tiers; see [feature.test]
#
# Do not configure the C++ build inside Pixi (no `pixi run cmake`, no
# activated shell): it would pick up Pixi's GDAL.  Configure outside and pass
# the test environment's interpreter with -DPython3_EXECUTABLE.
# -----------------------------------------------------------------------------

[dependencies]
python = ">=3.10"

# Raster / geospatial core, used by both python_helpers and tests/scripts.
gdal = "*"
numpy = "*"
rasterio = "*"

# MATLAB .mat reader, used by python_helpers/extract_lsdn_reference.py to read
# the Balco v3 LSDn reference grids.  It was already in the environment as a
# transitive dependency, but a helper that imports it must declare it.
scipy = "*"

# netCDF writer for the data/crn_parameters.nc packers
# (add_ncep_to_crn_nc.py, add_lsdn_to_crn_nc.py, build_crn_parameters_nc.py).
netcdf4 = "*"

# DEM and vector data download helpers.
requests = "*"
pystac-client = "*"
planetary-computer = "*"
geopandas = "*"
shapely = "*"

# Test tooling.
pytest = "*"

# -----------------------------------------------------------------------------
# Optional features
#
# Kept out of the default environment because they are heavy, optional, or only
# needed to score lsdtt3 rather than to build or run it.
# -----------------------------------------------------------------------------

# The CTest Python tiers (tests/CMakeLists.txt, LSDTT_ENABLE_PYTHON_TESTS and
# LSDTT_ENABLE_PYTHON_GEO_TESTS).  EXACTLY what they need, as a separate
# environment (no default feature) so the test contract does not drift with the
# helpers' dependencies:
#   python >= 3.10   the scripts use `X | None` annotations and `match`
#   gdal             the osgeo bindings AND gdalinfo / ogrinfo / gdal_translate,
#                    which about a quarter of the harness tests run
#   numpy rasterio geopandas shapely   the four tier_python_geo tests
#
# Configure the C++ build OUTSIDE Pixi (so it uses the system GDAL) and hand
# CMake this interpreter; run ctest inside the environment:
#
#   pixi install -e test
#   cmake -S . -B build -DLSDTT_ENABLE_PYTHON_TESTS=ON -DLSDTT_ENABLE_PYTHON_GEO_TESTS=ON \
#         -DPython3_EXECUTABLE="$(pixi run -e test python -c 'import sys; print(sys.executable)')"
#   pixi run -e test ctest --test-dir build --output-on-failure
#
# `pixi install` alone does not change the interpreter an existing build tree
# was configured with; re-run cmake with -DPython3_EXECUTABLE to switch.
[feature.test.dependencies]
python = ">=3.10"
gdal = "*"
numpy = "*"
rasterio = "*"
geopandas = "*"
shapely = "*"

# OSM feature download (python_helpers/osm_*.py).  osmnx pulls a large solve.
[feature.osm.dependencies]
osmnx = "*"

# Reference implementations used to validate lsdtt3's own algorithms.
#
# RichDEM MUST come from conda-forge, not pip: `pip install richdem` installs
# 0.3.4, which pins numpy<2 and will silently downgrade numpy in whatever
# environment it lands in.  conda-forge ships 2.4.3 with numpy-2 builds.
[feature.reference.dependencies]
# Python is pinned HERE, not in [dependencies], so it applies only to
# environments that include this feature -- the default environment stays on
# whatever `python = ">=3.10"` resolves to and is completely unaffected.
#
# The upper bound exists because topotoolbox ships wheels for cp311-cp313 only.
# Without it the environment resolves to 3.14 and silently builds from sdist,
# which succeeds on a developer machine with a compiler and fails in a bare CI
# container.
python = ">=3.11,<3.14"
richdem = "*"
xtensor = ">=0.27.1,<0.28"
xtensor-python = ">=0.29.0,<0.30"
# (scipy is in [dependencies], so it is already in this environment too.)

# topotoolbox is not on conda-forge, so it has to come from PyPI. This is the
# only PyPI dependency in the workspace and it is confined to this optional
# feature. Pinned exactly because the package is pre-1.0 (0.0.x) and its API
# still moves; the underlying algorithms are the mature TopoToolbox lineage.
[feature.reference.pypi-dependencies]
topotoolbox = "==0.0.12"

# Whitebox Workflows for Python -- the third external reference implementation,
# alongside RichDEM and TopoToolbox.  Kept in its OWN feature rather than folded
# into `reference` so it can be dropped from the solve independently: it is the
# only reference that is a large prebuilt binary, and a benchmark comparing only
# the other two must stay possible.
#
# Facts checked against whitebox-workflows 2.0.6 (2026-08-31), which is what the
# pin below allows:
#   - PyPI only; not on conda-forge.  ~22 MB wheel, ~60 MB installed, of which
#     56.8 MB is a single Rust-built `whitebox_workflows.abi3.so`.
#   - ZERO Python dependencies, so it cannot perturb the numpy/GDAL solve that
#     the rest of this environment depends on.
#   - cp39-abi3 wheels for linux-64 / osx-arm64 / win-64, so it is compatible
#     with any Python the `reference` feature's >=3.11,<3.14 pin resolves to.
#   - MIT OR Apache-2.0.
#   - Licensing: `wb.WbEnvironment()` is "open tier" and needs NO licence key.
#     733 of its 775 tools are open tier; every tool the benchmarks use --
#     fill_depressions, breach_depressions_least_cost, d8_pointer,
#     d8_flow_accum, dinf_flow_accum, fd8_flow_accum, slope, aspect,
#     plan/profile_curvature, hillshade -- is open.  A benchmark driver must
#     never construct a Pro/entitlement environment: a benchmark that needs a
#     paid key is not reproducible by a reviewer.
#
# Pinned to a minor range because the 2.x API is explicitly described upstream
# as "in active modernization"; unpinned it would silently change what the
# published timings mean.
# Upstream ships no osx-64 wheel (Intel Mac), only linux-64, osx-arm64 and
# win-64, so the feature declares those three.  A workspace platform absent here
# is dropped from any environment including this feature, which is why the
# `benchmark-lite` environment exists: it is the osx-64 route.
[feature.whitebox]
platforms = ["linux-64", "osx-arm64", "win-64"]

[feature.whitebox.pypi-dependencies]
whitebox-workflows = "~=2.0.6"

# Benchmark entry points.
#
# Defined on the `whitebox` feature, not on `reference`, so the names resolve
# to EXACTLY ONE environment (`benchmark`).  Putting them on `reference` would
# make them ambiguous between `benchmark` and `benchmark-lite` and pixi would
# stop to ask which one every time.  A benchmark-lite user runs the script
# directly:
#
#     pixi run -e benchmark-lite python tests/scripts/run_benchmark_suite.py \
#         --profile laptop
#
# These are the ONLY benchmark entry points. The suite is not wired into CTest
# and `ctest` will never run it: it asserts nothing and cannot fail a build.
# Extra flags pass straight through, so `pixi run bench-laptop --dry-run` and
# `pixi run bench-laptop --cases fill` both work.
[feature.whitebox.tasks]
bench-laptop = """python tests/scripts/run_benchmark_suite.py --profile laptop"""
bench-server = """python tests/scripts/run_benchmark_suite.py --profile server"""

# Documentation site (mkdocs.yml at the repo root).  Kept out of the default
# environment because nobody building or running lsdtt3 needs it -- only whoever
# is publishing the site.
[feature.docs.dependencies]
mkdocs = "*"
mkdocs-material = "*"

[feature.docs.pypi-dependencies]
nanobind = ">=2.0"
scikit-build-core = ">=0.10"

# Tasks live on the feature, so they run in the docs environment automatically:
# `pixi run docs-build`, not `pixi run -e docs ...`.
#
# --strict turns broken internal links and pages missing from the nav into
# errors. A docs build that "succeeds" with dangling links is how a site rots.
[feature.docs.tasks]
docs-serve = "PYTHONPATH=./python_bindings/src mkdocs serve"
docs-build = "PYTHONPATH=./python_bindings/src mkdocs build --strict"

# Workflow orchestration tools (Snakemake + helpers), kept out of the default
# env because workflow execution is optional and can pull a larger solve.
[feature.workflows.dependencies]
python = ">=3.11,<3.14"
pyyaml = "*"
matplotlib = "*"

[feature.workflows.pypi-dependencies]
snakemake = "*"

[environments]
osm = ["osm"]
# The peer-review benchmark environment: all three external reference
# implementations in one place, so a reviewer runs one `pixi install -e
# benchmark` and can reproduce every published comparison.
benchmark = ["reference", "whitebox"]
# The same environment minus Whitebox, for a machine where the 60 MB binary
# wheel is unwanted or has no wheel for the platform.  Benchmark drivers skip
# any reference they cannot import, so this environment simply produces fewer
# rows.
benchmark-lite = ["reference"]
docs = ["docs"]
workflows = ["workflows"]
# The CTest Python tiers; see [feature.test.dependencies].
test = { features = ["test"], no-default-feature = true }

[tasks]
# Generic entry points only -- individual test suites are invoked through CTest
# or by calling their driver directly, so this file does not need editing when a
# test is added.
#
# Note there is no DEM-fetching task: fetching is done by the lsdtt3 CLI itself
# (`lsdtt-fetch-raster`), which needs no Python at all.
test-python = "pytest tests"
