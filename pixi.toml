[workspace]
name = "lsdtt3"
version = "0.1.0"
description = "Python environment for lsdtt3 test tooling and the python_helpers scripts."
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

# -----------------------------------------------------------------------------
# The C++ build is driven by CMake and does NOT need pixi.  This manifest exists
# only for the Python side of the repository:
#
#   python_helpers/   user-facing helpers (DEM download, raster -> PNG, OSM and
#                     geology vector downloads)
#   tests/scripts/    test orchestration (fixture fetch, CLI smoke runner,
#                     reference-data fetch, benchmark drivers)
#
# Users commonly have lsdviztools3 alongside lsdtt3, which also uses pixi on the
# conda-forge channel, so the two environments compose the same way.
#
#   pixi install                 # default environment
#   pixi run python python_helpers/download_dem_tiles.py --help
#   pixi shell                   # interactive
# -----------------------------------------------------------------------------

[dependencies]
python = ">=3.10"

# Raster / geospatial core, used by both python_helpers and tests/scripts.
gdal = "*"
numpy = "*"
rasterio = "*"

# DEM and vector data download helpers.
requests = "*"
pystac-client = "*"
planetary-computer = "*"
geopandas = "*"
shapely = "*"

# Test tooling.
pytest = "*"

# -----------------------------------------------------------------------------
# Optional features
#
# Kept out of the default environment because they are heavy, optional, or only
# needed to score lsdtt3 rather than to build or run it.
# -----------------------------------------------------------------------------

# OSM feature download (python_helpers/osm_*.py).  osmnx pulls a large solve.
[feature.osm.dependencies]
osmnx = "*"

# Reference implementations used to validate lsdtt3's own algorithms.
#
# RichDEM MUST come from conda-forge, not pip: `pip install richdem` installs
# 0.3.4, which pins numpy<2 and will silently downgrade numpy in whatever
# environment it lands in.  conda-forge ships 2.4.3 with numpy-2 builds.
[feature.reference.dependencies]
# Python is pinned HERE, not in [dependencies], so it applies only to
# environments that include this feature -- the default environment stays on
# whatever `python = ">=3.10"` resolves to and is completely unaffected.
#
# The upper bound exists because topotoolbox ships wheels for cp311-cp313 only.
# Without it the environment resolves to 3.14 and silently builds from sdist,
# which succeeds on a developer machine with a compiler and fails in a bare CI
# container.
python = ">=3.11,<3.14"
richdem = "*"
scipy = "*"

# topotoolbox is not on conda-forge, so it has to come from PyPI. This is the
# only PyPI dependency in the workspace and it is confined to this optional
# feature. Pinned exactly because the package is pre-1.0 (0.0.x) and its API
# still moves; the underlying algorithms are the mature TopoToolbox lineage.
[feature.reference.pypi-dependencies]
topotoolbox = "==0.0.12"

[environments]
osm = ["osm"]
benchmark = ["reference"]

[tasks]
# Generic entry points only -- individual test suites are invoked through CTest
# or by calling their driver directly, so this file does not need editing when a
# test is added.
#
# Note there is no DEM-fetching task: fetching is done by the lsdtt3 CLI itself
# (`lsdtt-fetch-raster`), which needs no Python at all.
test-python = "pytest tests"
