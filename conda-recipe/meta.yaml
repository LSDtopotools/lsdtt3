# conda-recipe/meta.yaml
#
# Conda-forge build recipe for lsdtt3.
#
# Status: not yet submitted to conda-forge. The repository is public, so it
#         can be; the steps are in docs/developer_notes/beta_testing_notes.md.
#
# To submit:
#   1. Switch source: to the tagged tarball below and fill in its sha256.
#   2. Open a PR against https://github.com/conda-forge/staged-recipes
#      adding this recipe under recipes/lsdtt3/meta.yaml.
#   3. The conda-forge bot will run the build, and on merge the package
#      becomes available via:  conda install -c conda-forge lsdtt3
#
# To test this recipe locally before submitting:
#   conda install conda-build
#   conda build conda-recipe/
#
# -------------------------------------------------------------------------

# A checked copy of project(lsdtt3 VERSION ...) in CMakeLists.txt, the single
# source of truth. Change it with tools/set_version.py; the CTest test
# unit_version_consistency fails if the two differ.
{% set version = "0.9.4" %}

package:
  name: lsdtt3
  version: {{ version }}

source:
  # Local test builds use the working tree. conda-build copies the whole
  # directory, so the local build/, dist/ and site/ trees are copied too, and
  # the binaries report a -dev/-dirty version because .git comes along.
  # For submission, switch to the tagged tarball: it has no .git, so the
  # binaries report the plain release version.
  path: ..
  #url: https://github.com/LSDtopotools/lsdtt3/archive/refs/tags/v{{ version }}.tar.gz
  # sha256: fill_this_in_before_submitting
  # Run: curl -fsSL <url> | sha256sum

build:
  number: 0
  # Windows is not built here: conda-build runs bld.bat on Windows, and this
  # recipe has only build.sh. The CMake build itself works with MSVC (it is
  # how the Windows backend bundle is made), so adding bld.bat is the route.
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >=3.15
    - ninja
    - pkg-config          # [unix]
  host:
    # libgdal-core is the GDAL C/C++ library. The "gdal" package is the
    # Python bindings, and would make this package depend on Python.
    # 3.4 (Ubuntu 22.04) is the oldest GDAL lsdtt3 is built and tested with;
    # conda-forge's global pin chooses the actual version.
    - libgdal-core >=3.4
    - fftw
    - eigen
    - libnetcdf
    # Apple Clang ships no OpenMP runtime; Linux gets libgomp from the compiler.
    - llvm-openmp         # [osx]
  run:
    # Runtime pins for these also come from the host packages' run_exports.
    # Eigen3 is header-only - no runtime dependency.
    - libgdal-core
    - fftw
    - libnetcdf
    - llvm-openmp         # [osx]

test:
  commands:
    - lsdtt-channel-extraction --help
    - lsdtt-basin-extraction --help
    - lsdtt-drainage-analysis --help
    - lsdtt-channel-extraction -v
    # Optional dependencies are skipped silently when CMake cannot find them.
    # Fail here rather than ship a package missing them: --help-json lists the
    # features a CLI was compiled with, and spectral-analysis only exists
    # when FFTW3 was found.
    - lsdtt-spectral-analysis --help
    - lsdtt-chi-analysis --help-json | grep -q '"eigen"'        # [unix]
    - lsdtt-cosmo-tool --help-json | grep -q '"netcdf"'         # [unix]
    # Bundled cosmogenic data, found relative to the installed executables.
    - test -f "${PREFIX}/share/lsdtt3/crn_parameters.nc"   # [unix]
    # Only the tools and their data are packaged.
    - test ! -d "${PREFIX}/include/lsdtt3"                  # [unix]

about:
  home: https://github.com/LSDtopotools/lsdtt3
  doc_url: https://lsdtopotools.github.io/lsdtt3/
  dev_url: https://github.com/LSDtopotools/lsdtt3
  license: AGPL-3.0-or-later
  license_file: LICENSE
  summary: LSDTopoTools3 - topographic analysis for geomorphology
  description: |
    LSDTopoTools3 (lsdtt3) is a C++17 library and collection of command-line
    tools for topographic analysis in geomorphology. It provides routines for
    channel extraction, basin delineation, chi analysis, cosmogenic nuclide
    analysis, hillslope metrics, spectral analysis, and more.

extra:
  recipe-maintainers:
    - simon-m-mudd
